# The FT morning brief (github.com/gonnzalofr/news_brief, image ghcr.io/gonnzalofr/news-brief).
# Every morning at BRIEF_TIME it reads the FT's public feeds, has Claude (or Gemini, or OpenAI)
# write the brief, keeps it, and pushes the top three headlines through ntfy. Its page is
# reached through a Tailscale Service (docs/network.md). The homelab only runs it: one port,
# one volume, /healthz and /readyz.
#
# With BRIEF_MODE=external the service writes no brief itself: an agent on the machine does,
# through the container (README, "Written by an agent"):
#   docker exec news-brief python -m brief fetch > items.json
#   docker exec -i news-brief python -m brief ingest --model claude < answer.json
#
# This file is the one for the homelab repository's services/news-brief/:
#   cp .env.example .env && chmod 600 .env    # then fill it in
#   docker compose up -d
name: news-brief

services:
  news-brief:
    image: ghcr.io/gonnzalofr/news-brief:0.1.0
    container_name: news-brief
    restart: unless-stopped
    # A ceiling, so a leak here can't take the machine's memory from the others.
    mem_limit: 256m
    # Settings listed one by one, not passed as a whole .env: an empty PORT= in an env_file
    # would replace the image's own value.
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      BRIEF_TIME: ${BRIEF_TIME:-07:00}
      BRIEF_MODE: ${BRIEF_MODE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      BRIEF_URL: ${BRIEF_URL:-}
      FEEDS: ${FEEDS:-}
      BRIEF_TWEAKS: ${BRIEF_TWEAKS:-}
    ports:
      # The machine's own loopback only: the way Tailscale Services reaches it.
      - "127.0.0.1:4960:4960"
    volumes:
      # One JSON file per brief, and state.json. Small; worth keeping as the archive.
      - news-brief-data:/data

volumes:
  news-brief-data:
    name: news-brief-data

networks:
  default:
    name: homelab
    external: true
