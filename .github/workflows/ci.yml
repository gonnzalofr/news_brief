# On every push and pull request: the unit tests, then the image, built (which runs the tests
# again inside it), started and asked for /healthz. On main, the image is published as
# ghcr.io/gonnzalofr/news-brief:main and :sha-<commit>. On a tag vX.Y.Z that matches VERSION,
# also as :X.Y.Z, the version the homelab pins.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/gonnzalofr/news-brief
    steps:
      - uses: actions/checkout@v7
      - name: A release's tag is VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" || { echo "Tag $GITHUB_REF_NAME isn't VERSION $(cat VERSION)"; exit 1; }
      - name: Build
        run: docker build --pull --tag news-brief:ci --label "org.opencontainers.image.revision=${GITHUB_SHA}" --label "org.opencontainers.image.version=$(cat VERSION)" .
      - name: Start it
        run: |
          docker run --detach --name brief --publish 127.0.0.1:4960:4960 news-brief:ci
          for _ in $(seq 1 30); do curl --silent --fail http://127.0.0.1:4960/healthz && exit 0; sleep 1; done
          docker logs brief; exit 1
      - name: Publish
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then tags="main sha-${GITHUB_SHA::7}"; else tags="${GITHUB_REF_NAME#v}"; fi
          for tag in $tags; do docker tag news-brief:ci "$IMAGE:$tag"; docker push "$IMAGE:$tag"; done
